<text x="40" y="51" font-size="29" style="fill:#193747">14 / 施工与隐蔽记录</text>
<text x="40" y="85" font-size="17" style="fill:#667780">下一工序前，把看不见的质量检查好；用楼层、户号、标尺和日期记录</text>
