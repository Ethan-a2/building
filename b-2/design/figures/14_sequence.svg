<text x="931" y="455" font-size="18" style="fill:#667780">倒灌 / 冻堵 / 结露</text>
<text x="60" y="635" font-size="22" style="fill:#193747">归档：隐蔽照片 + 试验数据 + 竣工尺寸 + 回路/阀门表 + 设备说明 + 可拆区标记。</text>
<text x="60" y="680" font-size="20" style="fill:#193747">现场变更同步图纸、参数和模型；结构、电气、供暖等专项数据由相应设计与检测确定。</text>
<text x="40" y="758" font-size="15" style="fill:#667780">B-2 · R1 / 概念深化与施工交底准备 · 图示不替代测量、结构和专项设计</text>
