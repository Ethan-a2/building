<text x="40" y="51" font-size="29" style="fill:#193747">10 / 地面防潮与墙脚</text>
<text x="40" y="85" font-size="17" style="fill:#667780">构造功能示意；具体层次、材料和厚度由地基、地坪和热工设计确定</text>
