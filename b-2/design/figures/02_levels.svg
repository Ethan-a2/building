<text x="40" y="51" font-size="29" style="fill:#193747">02 / 高差、地坪与入口</text>
<text x="40" y="85" font-size="17" style="fill:#667780">只表达关系；±0.000、回填高度、挡土尺寸必须由现场测量与设计确定</text>
