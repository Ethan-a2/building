<text x="841" y="201" font-size="22" style="fill:#193747">污水独立系统</text>
<text x="841" y="235" font-size="18" style="fill:#667780">厨卫 → 立管 → 检查井</text>
<text x="841" y="262" font-size="18" style="fill:#667780"></text>
<text x="841" y="289" font-size="18" style="fill:#667780">市政污水或合规处理设施</text>
<text x="841" y="316" font-size="18" style="fill:#667780"></text>
<text x="841" y="343" font-size="18" style="fill:#667780">化粪池需清掏通路</text>
<text x="841" y="370" font-size="18" style="fill:#667780">尾水去向另行确定</text>
<text x="841" y="397" font-size="18" style="fill:#667780"></text>
<text x="841" y="424" font-size="18" style="fill:#667780">严禁与雨水随意混接</text>
