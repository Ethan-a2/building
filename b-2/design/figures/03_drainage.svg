<text x="446" y="361" font-size="22" style="fill:#193747">B 合法出口需要提升</text>
<text x="446" y="395" font-size="18" style="fill:#667780">集水坑 + 泵 + 报警</text>
<text x="446" y="422" font-size="18" style="fill:#667780">考虑停电、冻堵和应急蓄水</text>
<rect x="430" y="545" width="350" height="115" rx="8" fill="#f7e7e2" stroke="#b5c5ca" stroke-width="2"/>
<text x="446" y="576" font-size="22" style="fill:#193747">C 无合法出口</text>
<text x="446" y="610" font-size="18" style="fill:#667780">先协调出口与权属</text>
<text x="446" y="637" font-size="18" style="fill:#667780">不擅排邻地、不默认渗井</text>
